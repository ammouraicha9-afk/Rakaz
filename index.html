<script>
    const url = "https://xijdfpaawyzauybzhywc.supabase.co";
    const key = "sb_publishable_0kZheKI4nxeKtyao-4kI6Q_iCMAKcka";

    let dbClient = null;
    let currentUser = null;
    let cardsData = [];
    let currentFiltered = [];
    let cardIdx = 0;

    const defaultUE4Cards = [
      { ue: "UE4", chapter: "Évaluation des méthodes diagnostiques", question: "Qu'est-ce que la sensibilité (Se) d'un test ?", answer: "Capacité du test à donner un résultat positif quand la maladie est présente : P(T+ | M+).", status: 0 },
      { ue: "UE4", chapter: "Évaluation des méthodes diagnostiques", question: "Qu'est-ce que la spécificité (Spe) d'un test ?", answer: "Capacité du test à donner un résultat négatif quand la maladie est absente : P(T- | M-).", status: 0 },
      { ue: "UE4", chapter: "Évaluation des méthodes diagnostiques", question: "De quoi dépendent les valeurs prédictives (VPP / VPN) ?", answer: "Elles dépendent directement de la prévalence de la maladie dans la population étudiée.", status: 0 },
      { ue: "UE4", chapter: "Biostatistiques et Probabilités", question: "Quelle est la formule de la loi de Bayes ?", answer: "P(A|B) = [P(B|A) * P(A)] / P(B)", status: 0 },
      { ue: "UE4", chapter: "Biostatistiques et Probabilités", question: "Qu'est-ce que l'erreur de type I (risque alpha) ?", answer: "C'est le risque de rejeter l'hypothèse nulle H0 alors qu'elle est vraie (faux positif).", status: 0 }
    ];

    function initSupabase() {
      if (window.supabase && window.supabase.createClient) {
        dbClient = window.supabase.createClient(url, key);
        checkUser();
      } else {
        setTimeout(initSupabase, 100);
      }
    }

    async function checkUser() {
      if (!dbClient) return;
      const { data: { user } } = await dbClient.auth.getUser();
      if (user) {
        currentUser = user;
        document.getElementById('authView').style.display = 'none';
        document.getElementById('appView').style.display = 'flex';
        await loadCards();
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await dbClient.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('authError').innerText = error.message;
      else checkUser();
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await dbClient.auth.signUp({ email, password });
      if (error) document.getElementById('authError').innerText = error.message;
      else alert("Compte créé ! Connectez-vous.");
    }

    async function handleLogout() {
      if (dbClient) await dbClient.auth.signOut();
      location.reload();
    }

    async function loadCards() {
      const { data, error } = await dbClient.from('flashcards').select('*');
      if (error) {
        alert("Erreur chargement : " + error.message);
        return;
      }
      cardsData = data || [];
      renderSidebar();
      renderDashboard();
    }

    async function importUE4Cards() {
      // 1. Récupération garantie de l'utilisateur actif
      const { data: { user }, error: userError } = await dbClient.auth.getUser();
      
      if (userError || !user) {
        alert("Session introuvable. Veuillez vous déconnecter et vous reconnecter.");
        return;
      }

      currentUser = user;

      // 2. Préparation des cartes avec le user_id explicite
      const payload = defaultUE4Cards.map(c => ({
        ue: c.ue,
        chapter: c.chapter,
        question: c.question,
        answer: c.answer,
        status: c.status,
        user_id: user.id
      }));

      // 3. Insertion en base
      const { error } = await dbClient.from('flashcards').insert(payload);

      if (error) {
        alert("Erreur d'importation : " + error.message);
      } else {
        alert("Cartes UE4 importées avec succès !");
        await loadCards(); // Recharge immédiatement la liste depuis Supabase
      }
    }

    function getColorForPercent(percent) {
      if (percent < 40) return "var(--hard)";
      if (percent < 80) return "var(--medium)";
      return "var(--easy)";
    }

    function renderSidebar() {
      const folderTree = document.getElementById('folderTree');
      folderTree.innerHTML = '';

      const ues = [...new Set(cardsData.map(c => c.ue || 'Général'))];
      ues.forEach(ue => {
        const ueDiv = document.createElement('div');
        ueDiv.innerHTML = `<div class="ue-header">📁 ${ue}</div>`;
        
        const chapDiv = document.createElement('div');
        const chapters = [...new Set(cardsData.filter(c => (c.ue || 'Général') === ue).map(c => c.chapter))];
        chapters.forEach(chap => {
          chapDiv.innerHTML += `
            <div class="folder-item" onclick="startPractice('${chap}')">
              📄 ${chap}
            </div>
          `;
        });
        
        ueDiv.appendChild(chapDiv);
        folderTree.appendChild(ueDiv);
      });
    }

    function renderDashboard() {
      document.getElementById('mainTitle').innerText = "Tableau de bord — Mes Dossiers";
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('practiceView').style.display = 'none';

      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = '';
      
      const chapters = [...new Set(cardsData.map(c => c.chapter))];
      
      if (chapters.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b;">Aucun cours trouvé. Cliquez sur le bouton **"📥 Importer UE4"** ci-dessus pour charger tes fiches !</p>`;
        return;
      }

      chapters.forEach(chap => {
        const chapCards = cardsData.filter(c => c.chapter === chap);
        const acquired = chapCards.filter(c => c.status === 2).length;
        const percent = chapCards.length ? Math.round((acquired/chapCards.length)*100) : 0;
        const color = getColorForPercent(percent);

        grid.innerHTML += `
          <div class="dash-card" onclick="startPractice('${chap}')">
            <div>
              <h3 style="font-size:1.1rem; color:#1e293b; margin-bottom:8px;">${chap}</h3>
              <p style="font-size:1.8rem; font-weight:bold; color:${color}; margin:6px 0;">${percent}%</p>
            </div>
            <div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${percent}%; background: ${color};"></div>
              </div>
              <p style="font-size:0.85rem; color:#64748b;">${acquired} / ${chapCards.length} acquises</p>
            </div>
          </div>
        `;
      });
    }

    function showDashboard() { renderDashboard(); }

    function startPractice(chap) {
      currentFiltered = cardsData.filter(c => c.chapter === chap);
      cardIdx = 0;
      document.getElementById('mainTitle').innerText = chap;
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('practiceView').style.display = 'block';
      showCard();
    }

    function showCard() {
      document.getElementById('card').classList.remove('flipped');
      if (currentFiltered.length > 0) {
        document.getElementById('cardProgress').innerText = `Carte ${cardIdx + 1} / ${currentFiltered.length}`;
        document.getElementById('cardQ').innerHTML = currentFiltered[cardIdx].question;
        document.getElementById('cardA').innerHTML = currentFiltered[cardIdx].answer;
      } else {
        renderDashboard();
      }
    }

    function flipCard() { document.getElementById('card').classList.toggle('flipped'); }

    async function rateCard(status) {
      if(currentFiltered.length === 0) return;
      const card = currentFiltered[cardIdx];
      card.status = status;
      await dbClient.from('flashcards').update({ status }).eq('id', card.id);
      cardIdx = (cardIdx + 1) % currentFiltered.length;
      showCard();
    }

    async function deleteCurrentCard() {
      if(confirm("Supprimer cette carte ?")) {
        const card = currentFiltered[cardIdx];
        await dbClient.from('flashcards').delete().eq('id', card.id);
        await loadCards();
      }
    }

    function openNewCardModal() { document.getElementById('createModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function saveNewCard() {
      const { data: { user } } = await dbClient.auth.getUser();
      const ue = document.getElementById('modalUe').value || "Général";
      const chapter = document.getElementById('modalChap').value || "Divers";
      const question = document.getElementById('modalQ').value;
      const answer = document.getElementById('modalA').value;

      if (question && answer && user) {
        const { error } = await dbClient.from('flashcards').insert([{ user_id: user.id, ue, chapter, question, answer, status: 0 }]);
        if(error) alert("Erreur : " + error.message);
        else {
          closeModal('createModal');
          await loadCards();
        }
      }
    }

    initSupabase();
  </script>
