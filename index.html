<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rakaz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #4f46e5; --sidebar-bg: #1e293b; --bg: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 290px; background: var(--sidebar-bg); color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .folder-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; cursor: pointer; border-radius: 6px; color: #cbd5e1; }
    .folder-item:hover { background: #334155; }
    .btn-del { color: #f87171; font-size: 0.8rem; cursor: pointer; padding: 4px; }
    
    .main-content { flex: 1; padding: 25px; overflow-y: auto; }
    .btn-action { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
    .modal-card { background: white; padding: 25px; border-radius: 12px; width: 400px; display: flex; flex-direction: column; gap: 12px; }
    select, input, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; }
  </style>
</head>
<body>

  <div id="authView" style="display:flex; height:100vh; width:100vw; align-items:center; justify-content:center; background:var(--sidebar-bg);">
    <div style="background:white; padding:30px; border-radius:12px; display:flex; flex-direction:column; gap:10px;">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Mot de passe">
      <button class="btn-action" onclick="handleLogin()">Connexion</button>
    </div>
  </div>

  <div id="appView" style="display:none; width:100vw; height:100vh; display:flex;">
    <div class="sidebar" id="sidebar">
      <h2 style="color:#38bdf8; margin-bottom:20px;">Rakaz</h2>
      <button class="btn-action" onclick="renderDashboard()">🏠 Accueil</button>
      <div id="folderTree" style="margin-top:15px;"></div>
    </div>
    <div class="main-content">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h2 id="mainTitle">Tableau de bord</h2>
        <button class="btn-action" onclick="openModal()">+ Nouvelle Carte</button>
      </div>
      <div id="contentView"></div>
    </div>
  </div>

  <div class="modal-overlay" id="createModal">
    <div class="modal-card">
      <h3>Ajouter une carte</h3>
      <select id="selectUe" onchange="updateChapters()"></select>
      <select id="selectChap"></select>
      <input type="text" id="newUe" placeholder="Nouvelle UE (si besoin)" style="display:none;">
      <input type="text" id="newChap" placeholder="Nouveau Chapitre (si besoin)" style="display:none;">
      <textarea id="modalQ" placeholder="Question"></textarea>
      <textarea id="modalA" placeholder="Réponse"></textarea>
      <button class="btn-action" onclick="saveNewCard()">Enregistrer</button>
      <button onclick="closeModal()">Fermer</button>
    </div>
  </div>

  <script>
    const db = window.supabase.createClient("https://xijdfpaawyzauybzhywc.supabase.co", "sb_publishable_0kZheKI4nxeKtyao-4kI6Q_iCMAKcka");
    let cardsData = [];

    async function loadData() {
      const { data } = await db.from('flashcards').select('*');
      cardsData = data || [];
      renderSidebar();
    }

    function renderSidebar() {
      const tree = document.getElementById('folderTree');
      tree.innerHTML = '';
      const chapters = [...new Set(cardsData.map(c => c.chapter))];
      chapters.forEach(chap => {
        tree.innerHTML += `
          <div class="folder-item">
            <span onclick="startPractice('${chap}')">📄 ${chap}</span>
            <span class="btn-del" onclick="deleteFolder('${chap}')">🗑️</span>
          </div>`;
      });
    }

    async function deleteFolder(chap) {
      if(confirm(`Supprimer tout le chapitre ${chap} ?`)) {
        await db.from('flashcards').delete().eq('chapter', chap);
        loadData();
      }
    }

    function openModal() {
      document.getElementById('createModal').style.display = 'flex';
      const ues = ["Créer une nouvelle UE...", ...new Set(cardsData.map(c => c.ue))];
      const sel = document.getElementById('selectUe');
      sel.innerHTML = ues.map(u => `<option>${u}</option>`).join('');
      updateChapters();
    }

    function updateChapters() {
      const ue = document.getElementById('selectUe').value;
      const chaps = ["Créer un nouveau Chapitre...", ...new Set(cardsData.filter(c => c.ue === ue).map(c => c.chapter))];
      const sel = document.getElementById('selectChap');
      sel.innerHTML = chaps.map(c => `<option>${c}</option>`).join('');
    }

    async function saveNewCard() {
      // Logique simplifiée pour l'exemple
      const ue = document.getElementById('selectUe').value;
      const chapter = document.getElementById('selectChap').value;
      const question = document.getElementById('modalQ').value;
      const answer = document.getElementById('modalA').value;
      await db.from('flashcards').insert([{ ue, chapter, question, answer, user_id: (await db.auth.getUser()).data.user.id }]);
      closeModal();
      loadData();
    }

    function closeModal() { document.getElementById('createModal').style.display = 'none'; }
    function startPractice(chap) { alert("Mode entraînement pour : " + chap); }
    function renderDashboard() { document.getElementById('contentView').innerHTML = "Vue d'ensemble"; }
    
    // Initialisation Auth
    db.auth.onAuthStateChange((e, s) => { if(s) { document.getElementById('authView').style.display='none'; document.getElementById('appView').style.display='flex'; loadData(); } });
    async function handleLogin() { await db.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }); }
  </script>
</body>
</html>
