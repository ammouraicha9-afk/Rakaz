<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakaz Flashcards</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f8fafc; }
        #sidebar { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 20px; overflow-y: auto; }
        #main { flex: 1; padding: 40px; overflow-y: auto; }
        
        .ue-header { margin-top: 15px; font-weight: bold; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .folder-item { display: flex; justify-content: space-between; padding: 8px 0; align-items: center; cursor: pointer; }
        .folder-actions { display: flex; gap: 5px; }
        
        .dash-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; transition: transform 0.1s; }
        .dash-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .progress-bar-bg { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { height: 100%; transition: width 0.3s; }
        
        .flashcard { background: white; padding: 40px; border-radius: 15px; border: 1px solid #e2e8f0; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        .btn-action { border: none; border-radius: 6px; cursor: pointer; color: white; padding: 8px 16px; }
        .action-icon { background: none; border: none; cursor: pointer; font-size: 1rem; }
        .hidden { display: none; }
        :root { --easy: #22c55e; --medium: #eab308; --hard: #ef4444; }
    </style>
</head>
<body>

<div id="sidebar">
    <button onclick="openNewCardModal()" style="width:100%; padding:10px; margin-bottom:10px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">+ Nouvelle Carte</button>
    <button onclick="openExamModal()" style="width:100%; padding:10px; margin-bottom:10px; background:#475569; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">📝 Mode Examen</button>
    <button onclick="showDashboard()" style="width:100%; padding:8px; margin-bottom:10px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">🏠 Tableau de bord</button>
    <button onclick="showTrashView()" style="width:100%; padding:8px; margin-bottom:15px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">🗑️ Corbeille</button>
    <div id="folderTree"></div>
</div>

<div id="main">
    <h1 id="mainTitle" style="margin-top:0;">Tableau de bord</h1>
    
    <!-- Tableau de bord -->
    <div id="dashboardView">
        <div id="dashboardGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:20px;"></div>
    </div>

    <!-- Mode révision / pratique -->
    <div id="practiceView" class="hidden">
        <p id="cardProgress" style="font-weight:600; color:#64748b;"></p>
        <div id="card" class="flashcard" onclick="flipCard()">
            <div id="cardQ" style="font-size:1.2rem; font-weight:600; margin-bottom:15px;"></div>
            <div id="cardA" style="font-size:1.1rem; color:#334155; border-top:1px dashed #cbd5e1; padding-top:15px; width:100%;"></div>
        </div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="rateCard(0)" style="padding:10px 20px; background:var(--hard); color:white; border:none; border-radius:6px; cursor:pointer;">À revoir</button>
            <button onclick="rateCard(2)" style="padding:10px 20px; background:var(--easy); color:white; border:none; border-radius:6px; cursor:pointer;">Acquis</button>
            <button onclick="deleteCurrentCard()" style="padding:10px 20px; background:#94a3b8; color:white; border:none; border-radius:6px; cursor:pointer;">Mettre à la corbeille</button>
        </div>
    </div>

    <!-- Corbeille -->
    <div id="trashView" class="hidden">
        <div id="trashList" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<!-- Modale de création -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <h3>Nouvelle Carte</h3>
        <label style="font-size:0.9rem; font-weight:600;">UE :</label>
        <select id="modalUeSelect" onchange="handleUeChange()" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;"></select>
        <input type="text" id="modalUeInput" placeholder="Nom de la nouvelle UE" class="hidden" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
        
        <label style="font-size:0.9rem; font-weight:600;">Chapitre :</label>
        <select id="modalChapSelect" onchange="handleChapChange()" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;"></select>
        <input type="text" id="modalChapInput" placeholder="Nom du nouveau chapitre" class="hidden" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
        
        <label style="font-size:0.9rem; font-weight:600;">Question :</label>
        <textarea id="modalQ" placeholder="Votre question..." style="padding:8px; border-radius:6px; border:1px solid #cbd5e1; height:60px;"></textarea>
        
        <label style="font-size:0.9rem; font-weight:600;">Réponse :</label>
        <textarea id="modalA" placeholder="Votre réponse..." style="padding:8px; border-radius:6px; border:1px solid #cbd5e1; height:60px;"></textarea>
        
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
            <button onclick="closeModal('createModal')" style="padding:8px 16px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">Annuler</button>
            <button onclick="saveNewCard()" style="padding:8px 16px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;">Sauvegarder</button>
        </div>
    </div>
</div>

<!-- Modale d'examen -->
<div id="examModal" class="modal">
    <div class="modal-content">
        <h3>Sélectionner les chapitres pour l'examen</h3>
        <div id="examChaptersList" style="max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; border:1px solid #e2e8f0; padding:10px; border-radius:6px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
            <button onclick="closeModal('examModal')" style="padding:8px 16px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">Annuler</button>
            <button onclick="startExamSession()" style="padding:8px 16px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;">Démarrer l'examen</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION SUPABASE INTÉGRÉE ---
    const SUPABASE_URL = 'https://xijdfpaawyzauybzhywc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0kZheKI4nxeKtyao-4kI6Q_iCMAKcka';
    
    let dbClient;
    let cardsData = []; 
    let currentFiltered = [];
    let cardIdx = 0;

    function initSupabase() {
        dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        loadCards();
    }

    // --- CHARGEMENT AVEC SUPPORT HORS LIGNE ---
    async function loadCards() {
        try {
            const { data, error } = await dbClient.from('flashcards').select('*');
            if (error) throw error;
            
            cardsData = data;
            // Sauvegarde automatique dans le cache local du navigateur
            localStorage.setItem('rakaz_offline_data', JSON.stringify(cardsData));
        } catch (err) {
            console.warn("Mode hors ligne activé. Chargement depuis le cache local.");
            const cached = localStorage.getItem('rakaz_offline_data');
            if (cached) {
                cardsData = JSON.parse(cached);
            } else {
                cardsData = [];
            }
        }
        renderSidebar();
        renderDashboard();
    }

    // --- GESTION CORBEILLE & SUPPRESSION ---
    async function deleteFolder(chap) {
        if(confirm(`Mettre le dossier "${chap}" à la corbeille ?`)) {
            const activeCards = cardsData.filter(c => c.chapter === chap && c.status !== -1);
            for(let card of activeCards) {
                await dbClient.from('flashcards').update({ status: -1 }).eq('id', card.id);
            }
            await loadCards();
        }
    }

    async function deleteCurrentCard() {
        if(currentFiltered.length === 0) return;
        const card = currentFiltered[cardIdx];
        await dbClient.from('flashcards').update({ status: -1 }).eq('id', card.id);
        await loadCards();
        currentFiltered = cardsData.filter(c => c.chapter === card.chapter && c.status !== -1);
        showCard();
    }

    async function restoreCard(id) {
        await dbClient.from('flashcards').update({ status: 0 }).eq('id', id);
        await loadCards();
        showTrashView();
    }

    async function permanentDelete(id) {
        if(confirm("Supprimer définitivement cette carte ?")) {
            await dbClient.from('flashcards').delete().eq('id', id);
            await loadCards();
            showTrashView();
        }
    }

    // --- RENOMMAGE & ORGANISATION ---
    async function renameFolder(oldChap) {
        const newChap = prompt(`Renommer le dossier "${oldChap}" par :`, oldChap);
        if (newChap && newChap.trim() !== "" && newChap !== oldChap) {
            const activeInChap = cardsData.filter(c => c.chapter === oldChap && c.status !== -1);
            for(let card of activeInChap) {
                await dbClient.from('flashcards').update({ chapter: newChap.trim() }).eq('id', card.id);
            }
            await loadCards();
        }
    }

    async function renameUe(oldUe) {
        const newUe = prompt(`Renommer l'UE "${oldUe}" par :`, oldUe);
        if (newUe && newUe.trim() !== "" && newUe !== oldUe) {
            const activeInUe = cardsData.filter(c => (c.ue || 'Général') === oldUe && c.status !== -1);
            for(let card of activeInUe) {
                await dbClient.from('flashcards').update({ ue: newUe.trim() }).eq('id', card.id);
            }
            await loadCards();
        }
    }

    function moveFolder(chap, direction) {
        let activeChapters = [...new Set(cardsData.filter(c => c.status !== -1).map(c => c.chapter))];
        let index = activeChapters.indexOf(chap);
        if (index === -1) return;
        let targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= activeChapters.length) return;
        let temp = activeChapters[index];
        activeChapters[index] = activeChapters[targetIndex];
        activeChapters[targetIndex] = temp;
        localStorage.setItem('rakaz_chapters_order', JSON.stringify(activeChapters));
        renderSidebar();
        renderDashboard();
    }

    // --- RENDU INTERFACE ---
    function renderSidebar() {
        const folderTree = document.getElementById('folderTree');
        folderTree.innerHTML = '';
        const activeCards = cardsData.filter(c => c.status !== -1);
        let chapters = [...new Set(activeCards.map(c => c.chapter))];
        const savedOrder = JSON.parse(localStorage.getItem('rakaz_chapters_order'));
        if (savedOrder) {
            chapters.sort((a, b) => {
                let posA = savedOrder.indexOf(a);
                let posB = savedOrder.indexOf(b);
                if (posA === -1) posA = 999;
                if (posB === -1) posB = 999;
                return posA - posB;
            });
        }
        const ues = [...new Set(activeCards.map(c => c.ue || 'Général'))];
        ues.forEach(ue => {
            const safeUe = ue.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const ueDiv = document.createElement('div');
            ueDiv.innerHTML = `<div class="ue-header"><span>📁 ${ue}</span><button class="action-icon" title="Renommer l'UE" onclick="renameUe('${safeUe}')">✏️</button></div>`;
            const chapDiv = document.createElement('div');
            const chapInUe = chapters.filter(chap => {
                const sample = activeCards.find(c => c.chapter === chap);
                return sample && (sample.ue || 'Général') === ue;
            });
            chapInUe.forEach(chap => {
                const safeChap = chap.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                chapDiv.innerHTML += `
                    <div class="folder-item">
                        <span onclick="startPractice('${safeChap}')" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.9rem;">📄 ${chap}</span>
                        <div class="folder-actions">
                            <button class="action-icon" title="Monter" onclick="moveFolder('${safeChap}', -1)">⬆️</button>
                            <button class="action-icon" title="Descendre" onclick="moveFolder('${safeChap}', 1)">⬇️</button>
                            <button class="action-icon" title="Renommer" onclick="renameFolder('${safeChap}')">✏️</button>
                            <button class="action-icon" title="Corbeille" onclick="deleteFolder('${safeChap}')">🗑️</button>
                        </div>
                    </div>`;
            });
            ueDiv.appendChild(chapDiv);
            folderTree.appendChild(ueDiv);
        });
    }

    function renderDashboard() {
        document.getElementById('mainTitle').innerText = "Tableau de bord — Mes Dossiers";
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('practiceView').style.display = 'none';
        document.getElementById('trashView').style.display = 'none';
        const grid = document.getElementById('dashboardGrid');
        grid.innerHTML = '';
        const activeCards = cardsData.filter(c => c.status !== -1);
        let chapters = [...new Set(activeCards.map(c => c.chapter))];
        const savedOrder = JSON.parse(localStorage.getItem('rakaz_chapters_order'));
        if (savedOrder) {
            chapters.sort((a, b) => {
                let posA = savedOrder.indexOf(a);
                let posB = savedOrder.indexOf(b);
                if (posA === -1) posA = 999;
                if (posB === -1) posB = 999;
                return posA - posB;
            });
        }
        if (chapters.length === 0) { 
            grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#64748b;">Aucun cours actif. Créez votre première carte !</p>`; 
            return; 
        }
        chapters.forEach(chap => {
            const chapCards = activeCards.filter(c => c.chapter === chap);
            const acquired = chapCards.filter(c => c.status === 2).length;
            const percent = chapCards.length ? Math.round((acquired/chapCards.length)*100) : 0;
            const color = percent < 40 ? "var(--hard)" : percent < 80 ? "var(--medium)" : "var(--easy)";
            const safeChap = chap.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            grid.innerHTML += `
                <div class="dash-card" onclick="startPractice('${safeChap}')">
                    <h3 style="margin:0 0 8px 0; font-size:1.1rem; color:#1e293b;">${chap}</h3>
                    <p style="font-size:1.8rem; font-weight:bold; color:${color}; margin:6px 0;">${percent}%</p>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%; background:${color};"></div></div>
                    <p style="font-size:0.85rem; color:#64748b; margin:4px 0 0 0;">${acquired} / ${chapCards.length} acquises</p>
                </div>`;
        });
    }

    function showDashboard() { renderDashboard(); }

    // --- REVISION & EXAMEN ---
    function startPractice(chap) {
        currentFiltered = cardsData.filter(c => c.chapter === chap && c.status !== -1);
        cardIdx = 0;
        document.getElementById('mainTitle').innerText = chap;
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('practiceView').style.display = 'block';
        document.getElementById('trashView').style.display = 'none';
        showCard();
    }

    function showCard() {
        const cardEl = document.getElementById('card');
        cardEl.classList.remove('flipped');
        if (currentFiltered.length > 0) {
            document.getElementById('cardProgress').innerText = `Carte ${cardIdx + 1} / ${currentFiltered.length}`;
            document.getElementById('cardQ').innerHTML = currentFiltered[cardIdx].question;
            document.getElementById('cardA').innerHTML = currentFiltered[cardIdx].answer;
            document.getElementById('cardA').style.display = 'none';
        } else { 
            renderDashboard(); 
        }
    }

    function flipCard() { 
        document.getElementById('card').classList.toggle('flipped'); 
        const a = document.getElementById('cardA');
        a.style.display = a.style.display === 'none' ? 'block' : 'none';
    }

    async function rateCard(status) {
        if(currentFiltered.length === 0) return;
        const card = currentFiltered[cardIdx];
        card.status = status;
        await dbClient.from('flashcards').update({ status }).eq('id', card.id);
        await loadCards();
        cardIdx = (cardIdx + 1) % currentFiltered.length;
        showCard();
    }

    function openExamModal() {
        const activeCards = cardsData.filter(c => c.status !== -1);
        const chapters = [...new Set(activeCards.map(c => c.chapter))];
        const listDiv = document.getElementById('examChaptersList');
        if (chapters.length === 0) {
            alert("Aucun cours disponible pour un examen !");
            return;
        }
        listDiv.innerHTML = chapters.map(chap => `
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem; cursor:pointer;">
                <input type="checkbox" value="${chap}" checked style="width:auto;"> ${chap}
            </label>
        `).join('');
        document.getElementById('examModal').style.display = 'flex';
    }

    function startExamSession() {
        const checkboxes = document.querySelectorAll('#examChaptersList input[type="checkbox"]:checked');
        const selectedChapters = Array.from(checkboxes).map(cb => cb.value);
        if (selectedChapters.length === 0) {
            alert("Sélectionne au moins un chapitre !");
            return;
        }
        currentFiltered = cardsData.filter(c => selectedChapters.includes(c.chapter) && c.status !== -1);
        currentFiltered.sort(() => Math.random() - 0.5);
        if (currentFiltered.length === 0) {
            alert("Aucune carte dans les chapitres sélectionnés.");
            return;
        }
        closeModal('examModal');
        cardIdx = 0;
        document.getElementById('mainTitle').innerText = "📝 Examen Personnalisé";
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('practiceView').style.display = 'block';
        document.getElementById('trashView').style.display = 'none';
        showCard();
    }

    // --- CORBEILLE VUE ---
    function showTrashView() {
        document.getElementById('mainTitle').innerText = "Corbeille";
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('practiceView').style.display = 'none';
        document.getElementById('trashView').style.display = 'block';
        const trashList = document.getElementById('trashList');
        const deletedCards = cardsData.filter(c => c.status === -1);
        if (deletedCards.length === 0) {
            trashList.innerHTML = `<p style="color:#64748b;">La corbeille est vide.</p>`;
            return;
        }
        trashList.innerHTML = deletedCards.map(c => `
            <div style="background:white; padding:15px; border-radius:10px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <div>
                    <span style="font-size:0.8rem; background:#e2e8f0; padding:2px 6px; border-radius:4px; font-weight:600;">${c.chapter}</span>
                    <p style="margin-top:6px; font-weight:600; font-size:0.95rem;">${c.question}</p>
                </div>
                <div style="display:flex; gap:8px; flex-shrink:0;">
                    <button class="btn-action" style="background:#22c55e;" onclick="restoreCard('${c.id}')">Restaurer</button>
                    <button class="btn-action" style="background:#ef4444;" onclick="permanentDelete('${c.id}')">Supprimer</button>
                </div>
            </div>
        `).join('');
    }

    // --- MODALE CRÉATION ---
    function openNewCardModal() {
        document.getElementById('createModal').style.display = 'flex';
        const ues = [...new Set(cardsData.filter(c => c.status !== -1).map(c => c.ue || 'Général'))];
        const ueSelect = document.getElementById('modalUeSelect');
        ueSelect.innerHTML = ues.map(u => `<option value="${u}">${u}</option>`).join('') + `<option value="new">➕ Créer une nouvelle UE...</option>`;
        handleUeChange();
    }

    function handleUeChange() {
        const ueSelect = document.getElementById('modalUeSelect');
        const ueInput = document.getElementById('modalUeInput');
        ueInput.style.display = ueSelect.value === 'new' ? 'block' : 'none';
        const selectedUe = ueSelect.value === 'new' ? '' : ueSelect.value;
        const chapters = [...new Set(cardsData.filter(c => c.status !== -1 && (c.ue || 'Général') === selectedUe).map(c => c.chapter))];
        const chapSelect = document.getElementById('modalChapSelect');
        chapSelect.innerHTML = chapters.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="new">➕ Créer un nouveau chapitre...</option>`;
        handleChapChange();
    }

    function handleChapChange() {
        const chapSelect = document.getElementById('modalChapSelect');
        const chapInput = document.getElementById('modalChapInput');
        chapInput.style.display = chapSelect.value === 'new' ? 'block' : 'none';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function saveNewCard() {
        const ueSelect = document.getElementById('modalUeSelect');
        const ueInput = document.getElementById('modalUeInput');
        const ue = ueSelect.value === 'new' ? ueInput.value.trim() : ueSelect.value;

        const chapSelect = document.getElementById('modalChapSelect');
        const chapInput = document.getElementById('modalChapInput');
        const chapter = chapSelect.value === 'new' ? chapInput.value.trim() : chapSelect.value;

        const question = document.getElementById('modalQ').value.trim();
        const answer = document.getElementById('modalA').value.trim();

        if (!ue || !chapter || !question || !answer) {
            alert("Veuillez remplir tous les champs !");
            return;
        }

        const { error } = await dbClient.from('flashcards').insert([{ ue, chapter, question, answer, status: 0 }]);
        if(error) {
            alert("Erreur : " + error.message);
        } else {
            document.getElementById('modalQ').value = '';
            document.getElementById('modalA').value = '';
            closeModal('createModal');
            await loadCards();
        }
    }

    // Démarrage de l'application
    initSupabase();
</script>
</body>
</html>
